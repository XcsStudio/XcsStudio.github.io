<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>XCSStudio · 账户管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4); }
        .admin-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: var(--shadow-md); width: 100%; max-width: 560px; }
        .admin-header { text-align: center; margin-bottom: var(--space-6); }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--color-success); color: #1f3b2c; padding: var(--space-1) var(--space-3); border-radius: 40px; font-size: var(--text-xs); margin-top: var(--space-2); }
        body.dark .status-badge { color: #c8e6d9; background: #2a5f4b; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); flex-wrap: wrap; gap: var(--space-2); }
        .info-label { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text-secondary); min-width: 100px; }
        .info-label svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; fill: none; }
        .info-value { color: var(--text-primary); word-break: break-word; flex: 1; }
        .action-buttons { display: flex; gap: var(--space-4); margin-top: var(--space-8); flex-wrap: wrap; }
        .btn { flex: 1; padding: var(--space-3); border-radius: var(--radius-md); font-weight: 500; text-align: center; cursor: pointer; border: none; font-family: inherit; font-size: var(--text-base); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: filter 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .btn-primary { background-color: var(--color-primary); color: white; }
        .btn-primary:hover { filter: brightness(0.9); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); }
        .btn-secondary:hover { border-color: var(--color-error); color: var(--color-error); background-color: rgba(231, 178, 166, 0.1); }
        .btn-danger { background-color: var(--color-error); color: #631d12; }
        .btn-danger:hover { filter: brightness(0.9); }
        .back-home { text-align: center; margin-top: var(--space-6); }
        .back-home a { color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); white-space: nowrap; }
        .back-home a:hover { color: var(--color-primary); }
        @media (max-width: 480px) { .admin-card { padding: var(--space-6); } .info-row { flex-direction: column; align-items: flex-start; } .action-buttons { flex-direction: column; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" id="logoHome">XCS<span>Studio</span></div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><button class="theme-toggle" id="themeToggle" aria-label="主题切换">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button></li>
            </ul>
        </div>
    </nav>

    <div class="admin-section">
        <div class="container" style="max-width:640px;">
            <div class="admin-card" id="adminCard">
                <div class="admin-header">
                    <h2>账户管理</h2>
                    <p>安全中心 · 个人信息</p>
                    <div class="status-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> 已登录</div>
                </div>
                <div class="info-row"><div class="info-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>用户名</div><span class="info-value" id="displayNickname">—</span></div>
                <div class="info-row"><div class="info-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="11" width="14" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>密码</div><span class="info-value">•••••••• (哈希存储不可见)</span></div>
                <div class="info-row"><div class="info-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><circle cx="8" cy="15" r="1"/></svg>注册时间</div><span class="info-value" id="displayRegTime">—</span></div>
                <div class="info-row"><div class="info-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/><line x1="15" y1="9" x2="9" y2="15"/></svg>安全存储</div><span class="info-value">密码经 PBKDF2 加盐哈希，无法还原</span></div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="changePwdBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15v2M12 7v6M8 11h8"/><rect x="5" y="11" width="14" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>修改密码</button>
                    <button class="btn btn-secondary" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>
                    <button class="btn btn-danger" id="deleteAccountBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>注销账户</button>
                </div>
                <div class="back-home"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12h18M3 12l4-4M3 12l4 4"/></svg>返回首页</a></div>
            </div>
        </div>
    </div>

    <footer class="footer"><div class="container"><p>© 2026 XCSStudio 安全中心</p></div></footer>

    <script src="common.js"></script>
    <script>
        (function() {
            if (!window.xcsAuth) {
                alert('认证模块加载失败，请刷新页面重试');
                return;
            }
            if (window.themeUtils) themeUtils.initThemeToggle('themeToggle');
            const logo = document.getElementById('logoHome');
            if (logo) logo.onclick = () => window.location.href = 'index.html';
            
            (async () => {
                const valid = await window.xcsAuth.verifySession();
                if (!valid) {
                    window.location.href = 'login.html';
                    return;
                }
                const user = await window.xcsAuth.getCurrentUser();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('displayNickname').textContent = user.nickname;
                let regTime = '尚未记录';
                if (user.createdAt) {
                    try {
                        regTime = new Date(user.createdAt).toLocaleString('zh-CN');
                    } catch(e) { regTime = '格式异常'; }
                }
                document.getElementById('displayRegTime').textContent = regTime;
            })();
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.onclick = () => {
                window.xcsAuth.clearSession();
                window.location.href = 'index.html';
            };
            
            function showModal(title, fieldsHtml, buttons) {
                return new Promise((resolve) => {
                    const overlay = document.createElement('div');
                    overlay.className = 'modal-overlay';
                    let buttonsHtml = '';
                    for (const btn of buttons) {
                        buttonsHtml += `<button class="${btn.class}" data-action="${btn.action}">${btn.text}</button>`;
                    }
                    overlay.innerHTML = `
                        <div class="modal-container">
                            <h3>${title}</h3>
                            ${fieldsHtml}
                            <div class="modal-buttons">${buttonsHtml}</div>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                    const container = overlay.querySelector('.modal-container');
                    const inputs = container.querySelectorAll('input');
                    const btnElements = container.querySelectorAll('.modal-buttons button');
                    const cleanup = () => overlay.remove();
                    btnElements.forEach(btn => {
                        btn.onclick = () => {
                            const action = btn.getAttribute('data-action');
                            if (action === 'confirm') {
                                const values = {};
                                inputs.forEach(inp => { values[inp.name] = inp.value; });
                                resolve({ confirmed: true, values });
                            } else {
                                resolve({ confirmed: false, values: {} });
                            }
                            cleanup();
                        };
                    });
                });
            }
            
            const changeBtn = document.getElementById('changePwdBtn');
            if (changeBtn) {
                changeBtn.onclick = async () => {
                    const fieldsHtml = `
                        <div class="form-group"><label>当前密码</label><input type="password" name="oldPwd" autocomplete="off"></div>
                        <div class="form-group"><label>新密码 (至少8位，含字母和数字)</label><input type="password" name="newPwd" autocomplete="off"></div>
                        <div class="form-group"><label>确认新密码</label><input type="password" name="confirmPwd" autocomplete="off"></div>
                    `;
                    const result = await showModal('修改密码', fieldsHtml, [
                        { text: '取消', action: 'cancel', class: 'btn-cancel' },
                        { text: '确认修改', action: 'confirm', class: 'btn-confirm' }
                    ]);
                    if (!result.confirmed) return;
                    const { oldPwd, newPwd, confirmPwd } = result.values;
                    if (!oldPwd || !newPwd || !confirmPwd) {
                        alert('请完整填写所有字段');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        alert('两次输入的新密码不一致');
                        return;
                    }
                    const user = await window.xcsAuth.getCurrentUser();
                    if (!user) return;
                    const res = await window.xcsAuth.changePassword(user.nickname, oldPwd, newPwd);
                    alert(res.message);
                    if (res.success) {
                        setTimeout(() => window.location.reload(), 1000);
                    }
                };
            }
            
            const deleteBtn = document.getElementById('deleteAccountBtn');
            if (deleteBtn) {
                deleteBtn.onclick = async () => {
                    const confirmModal = await showModal('确认注销', '<p style="margin-bottom: var(--space-4);">此操作将永久删除您的账户，所有数据无法恢复。确定要继续吗？</p>', [
                        { text: '取消', action: 'cancel', class: 'btn-cancel' },
                        { text: '继续', action: 'confirm', class: 'btn-danger' }
                    ]);
                    if (!confirmModal.confirmed) return;
                    const pwdModal = await showModal('验证身份', '<div class="form-group"><label>请输入密码以确认注销</label><input type="password" name="password" autocomplete="off"></div>', [
                        { text: '取消', action: 'cancel', class: 'btn-cancel' },
                        { text: '永久注销', action: 'confirm', class: 'btn-danger' }
                    ]);
                    if (!pwdModal.confirmed) return;
                    const password = pwdModal.values.password;
                    if (!password) {
                        alert('请输入密码');
                        return;
                    }
                    const user = await window.xcsAuth.getCurrentUser();
                    if (!user) return;
                    const res = await window.xcsAuth.deleteAccount(user.nickname, password);
                    alert(res.message);
                    if (res.success) {
                        window.location.href = 'index.html';
                    }
                };
            }
        })();
    </script>
</body>
</html>
