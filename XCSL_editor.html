<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>XCSL Studio · 语言编辑器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 编辑器专属样式 */
        html, body { height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-body); }
        .navbar { flex-shrink: 0; }
        
        .editor-layout {
            flex: 1;
            display: flex;
            gap: var(--space-4);
            padding: var(--space-4);
            overflow: hidden;
            min-height: 0;
            position: relative;
        }
        .editor-wrapper {
            flex: 1;
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            position: relative;
        }
        .line-numbers {
            width: 48px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            padding: var(--space-4) 0;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            text-align: right;
            color: var(--text-muted);
            overflow-y: hidden;
            user-select: none;
            white-space: pre;
        }
        .line-numbers span {
            display: block;
            padding-right: 8px;
        }
        .code-container {
            flex: 1;
            position: relative;
            background: var(--bg-body);
        }
        textarea.code-area {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text-primary);
            border: none;
            padding: var(--space-4);
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            white-space: pre-wrap;
            tab-size: 4;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            caret-color: var(--color-primary);
        }
        .syntax-highlight {
            width: 100%;
            height: 100%;
            padding: var(--space-4);
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: transparent;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            overflow-y: auto;
        }
        .syntax-highlight code {
            display: block;
            color: var(--text-primary);
        }
        /* 语法高亮颜色 */
        .hl-keyword { color: #c678dd; font-weight: 500; }
        .hl-type { color: #61afef; }
        .hl-variable { color: #e5c07b; }
        .hl-number { color: #d19a66; }
        .hl-string { color: #98c379; }
        .hl-operator { color: #56b6c2; }
        .hl-comment { color: #7f848e; font-style: italic; }
        
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        .pane-header {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            font-weight: 500;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-2);
        }
        .toolbar { display: flex; gap: var(--space-2); }
        .tool-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-xs);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }
        .tool-btn:hover {
            background-color: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
            transform: translateY(-1px);
        }
        .run-btn {
            background-color: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }
        .output-area {
            flex: 1;
            background: var(--bg-body);
            padding: var(--space-4);
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .output-line {
            margin-bottom: 2px;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }
        .output-error { color: var(--color-error); border-left-color: var(--color-error); }
        .output-success { color: var(--color-success); }
        .output-normal { color: var(--text-primary); }
        .input-prompt-line {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }
        .input-prompt-line span { color: var(--color-primary); }
        .input-field {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: var(--radius-md);
            font-family: monospace;
            outline: none;
            width: 200px;
        }
        
        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(8px);
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: var(--radius-lg);
        }
        .login-prompt-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
        }
        .prompt-buttons { display: flex; gap: var(--space-3); justify-content: center; }
        .prompt-btn {
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: var(--text-sm);
            cursor: pointer;
            border: none;
        }
        .prompt-btn-primary { background-color: var(--color-primary); color: white; }
        .prompt-btn-secondary { background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .editor-layout { flex-direction: column; }
            body { overflow: auto; }
        }
        .blur-editor .editor-wrapper, .blur-editor .editor-pane { filter: blur(2px); pointer-events: none; user-select: none; }
        .footer { background: var(--bg-surface); border-top: 1px solid var(--border-light); padding: var(--space-6) 0; text-align: center; font-size: var(--text-sm); color: var(--text-muted); flex-shrink: 0; }
    </style>
</head>

            </ul>
        </div>
    </nav>

    <div class="editor-layout" id="editorLayout">
        <div class="editor-wrapper">
            <div class="line-numbers" id="lineNumbers"></div>
            <div class="code-container">
                <textarea id="codeEditor" class="code-area" spellcheck="false"></textarea>
                <div class="syntax-highlight" id="syntaxHighlight"><code></code></div>
            </div>
        </div>
        <div class="editor-pane">
            <div class="pane-header">
                <span>运行输出 / 交互控制台</span>
                <div class="toolbar">
                    <button class="tool-btn" id="openFileBtn">打开文件</button>
                    <button class="tool-btn" id="saveFileBtn">保存文件</button>
                    <button class="tool-btn run-btn" id="runCodeBtn">运行</button>
                    <button class="tool-btn" id="clearOutputBtn">清空</button>
                </div>
            </div>
            <div id="outputConsole" class="output-area"></div>
        </div>
    </div>

    <footer class="footer"><div class="container"><p>© 2026 XCSStudio · XCSL 语言环境 | 文件格式 .xcsl</p></div></footer>

    <script src="common.js"></script>
    <script>
        (function(){
            if(!window.xcsAuth){ alert('认证模块加载失败'); return; }
            if(window.themeUtils) themeUtils.initThemeToggle('themeToggle');
            
            const editorLayout = document.getElementById('editorLayout');
            const codeEditor = document.getElementById('codeEditor');
            const lineNumbersDiv = document.getElementById('lineNumbers');
            const syntaxHighlight = document.getElementById('syntaxHighlight');
            const outputConsole = document.getElementById('outputConsole');
            const runBtn = document.getElementById('runCodeBtn');
            const clearBtn = document.getElementById('clearOutputBtn');
            const openBtn = document.getElementById('openFileBtn');
            const saveBtn = document.getElementById('saveFileBtn');
            const accountBtn = document.getElementById('accountBtn');
            const navLoginText = document.getElementById('navLoginText');
            const logoHome = document.getElementById('logoHome');
            
            let isLoggedIn = false;
            let overlayElement = null;
            let currentInputResolver = null;
            
            function clearOutput() { outputConsole.innerHTML = ''; }
            function appendOutput(text, isError = false) {
                const div = document.createElement('div');
                div.className = `output-line ${isError ? 'output-error' : 'output-normal'}`;
                div.textContent = text;
                outputConsole.appendChild(div);
                div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            function requestInput(promptText) {
                return new Promise((resolve) => {
                    const inputContainer = document.createElement('div');
                    inputContainer.className = 'input-prompt-line';
                    inputContainer.innerHTML = `<span>${escapeHtml(promptText)}</span><input type="text" class="input-field" id="inlineInput" autofocus>`;
                    outputConsole.appendChild(inputContainer);
                    const inputField = inputContainer.querySelector('#inlineInput');
                    inputField.focus();
                    const onSubmit = () => {
                        const val = inputField.value;
                        inputContainer.remove();
                        resolve(val);
                    };
                    inputField.addEventListener('keypress', (e) => { if(e.key === 'Enter') onSubmit(); });
                });
            }
            
            function escapeHtml(str) { 
                return str.replace(/[&<>]/g, function(m){
                    if(m === '&') return '&amp;';
                    if(m === '<') return '&lt;';
                    if(m === '>') return '&gt;';
                    return m;
                });
            }
            
            // 智能分割 out/in 参数（忽略引号内的逗号）
            function splitArgs(argsStr) {
                const args = [];
                let current = '';
                let inString = false;
                for(let i=0; i<argsStr.length; i++) {
                    const ch = argsStr[i];
                    if(ch === '"' && (i===0 || argsStr[i-1] !== '\\')) {
                        inString = !inString;
                        current += ch;
                    } else if(ch === ',' && !inString) {
                        args.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                if(current.trim()) args.push(current.trim());
                return args;
            }
            
            // 表达式求值（支持 + - * / 和括号? 简易版支持变量、数字、字符串、运算）
            function evaluateExpression(expr, variables) {
                expr = expr.trim();
                // 字符串字面量直接返回
                if(expr.startsWith('"') && expr.endsWith('"')) {
                    let inner = expr.slice(1,-1).replace(/\\([nrt\\"])/g, (m,ch) => ({n:'\n',r:'\r',t:'\t','\\':'\\','"':'"'})[ch]||m);
                    return { type: 'str', value: inner };
                }
                // 数字
                if(/^-?\d+$/.test(expr)) return { type: 'int', value: parseInt(expr,10) };
                // 变量
                if(/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(expr)) {
                    if(!variables.has(expr)) return { error: `变量 "${expr}" 未定义` };
                    const v = variables.get(expr);
                    return { type: v.type, value: v.value };
                }
                // 表达式求值 (支持整数四则运算，无括号优先级简化：从左到右，但先乘除后加减)
                // 使用 Function 动态求值但为了安全我们手动计算（仅支持整数）
                // 简单实现：替换变量为值，然后 eval (安全可控，因为表达式仅含数字、运算符、变量)
                let evalExpr = expr;
                // 替换变量为实际值
                const varMatches = evalExpr.match(/[a-zA-Z_][a-zA-Z0-9_]*/g);
                if(varMatches) {
                    for(let vname of varMatches) {
                        if(variables.has(vname)) {
                            const val = variables.get(vname).value;
                            evalExpr = evalExpr.replace(new RegExp(`\\b${vname}\\b`, 'g'), val);
                        } else {
                            return { error: `变量 "${vname}" 未定义` };
                        }
                    }
                }
                // 检查是否只包含数字和运算符
                if(/^[0-9+\-*/()\s]+$/.test(evalExpr)) {
                    try {
                        // 使用 Function 更安全，但只允许算术运算
                        const result = Function('"use strict"; return (' + evalExpr + ')')();
                        if(typeof result !== 'number' || isNaN(result)) return { error: '表达式计算结果不是数字' };
                        return { type: 'int', value: Math.floor(result) };
                    } catch(e) { return { error: '表达式计算失败: ' + e.message }; }
                }
                return { error: '无效的表达式' };
            }
            
            // XCSL 解释器
            class XCSLInterpreter {
                constructor(outputCallback, inputCallback, errorCallback) {
                    this.variables = new Map();
                    this.outputCallback = outputCallback;
                    this.inputCallback = inputCallback;
                    this.errorCallback = errorCallback;
                }
                
                async executeLine(line, lineNo) {
                    line = line.trim();
                    if(line === '' || line.startsWith('//')) return true;
                    
                    // out(内容1, 内容2, ..., end=结尾)
                    let outMatch = line.match(/^out\((.*)\)$/i);
                    if(outMatch) {
                        let argsPart = outMatch[1].trim();
                        let endStr = null;
                        // 提取 end=xxx
                        const endRegex = /,\s*end\s*=\s*(.+)$/i;
                        let endMatch = argsPart.match(endRegex);
                        if(endMatch) {
                            endStr = endMatch[1].trim();
                            argsPart = argsPart.slice(0, argsPart.length - endMatch[0].length);
                        }
                        let rawParams = splitArgs(argsPart);
                        for(let p of rawParams) {
                            if(p === '') continue;
                            let ev = evaluateExpression(p, this.variables);
                            if(ev.error) {
                                this.errorCallback(lineNo, 'TypeError', ev.error);
                                return false;
                            }
                            let outVal = (ev.type === 'int') ? String(ev.value) : ev.value;
                            this.outputCallback(outVal, false);
                        }
                        if(endStr !== null) {
                            let endEv = evaluateExpression(endStr, this.variables);
                            if(endEv.error) {
                                this.errorCallback(lineNo, 'TypeError', endEv.error);
                                return false;
                            }
                            let endText = (endEv.type === 'int') ? String(endEv.value) : endEv.value;
                            this.outputCallback(endText, false);
                        }
                        return true;
                    }
                    
                    // set 类型 变量 = 表达式
                    let setMatch = line.match(/^set\s+(str|int)\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$/i);
                    if(setMatch) {
                        let varType = setMatch[1].toLowerCase();
                        let varName = setMatch[2];
                        let expr = setMatch[3].trim();
                        let val = evaluateExpression(expr, this.variables);
                        if(val.error) {
                            this.errorCallback(lineNo, 'TypeError', val.error);
                            return false;
                        }
                        if(varType !== val.type) {
                            this.errorCallback(lineNo, 'TypeError', `类型不匹配: 变量定义为${varType}, 表达式结果为${val.type}`);
                            return false;
                        }
                        this.variables.set(varName, { type: varType, value: val.value });
                        return true;
                    }
                    
                    // in(变量, 提示词)
                    let inMatch = line.match(/^in\(\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*,\s*(.+)\s*\)$/i);
                    if(inMatch) {
                        let varName = inMatch[1];
                        let promptExpr = inMatch[2].trim();
                        let promptVal = evaluateExpression(promptExpr, this.variables);
                        if(promptVal.error) {
                            this.errorCallback(lineNo, 'TypeError', `提示词错误: ${promptVal.error}`);
                            return false;
                        }
                        let promptText = (promptVal.type === 'int') ? String(promptVal.value) : promptVal.value;
                        if(!this.variables.has(varName)) {
                            this.errorCallback(lineNo, 'NameError', `变量 "${varName}" 未定义，请先用 set 定义`);
                            return false;
                        }
                        let varInfo = this.variables.get(varName);
                        this.outputCallback(promptText, false);
                        let userInput = await this.inputCallback(promptText);
                        if(varInfo.type === 'int') {
                            let num = parseInt(userInput, 10);
                            if(isNaN(num)) {
                                this.errorCallback(lineNo, 'TypeError', `输入内容无法转换为整数: "${userInput}"`);
                                return false;
                            }
                            varInfo.value = num;
                        } else {
                            varInfo.value = userInput;
                        }
                        this.variables.set(varName, varInfo);
                        return true;
                    }
                    
                    this.errorCallback(lineNo, 'SyntaxError', '无法识别的语句');
                    return false;
                }
                
                async run(code) {
                    this.variables.clear();
                    const lines = code.split(/\r?\n/);
                    for(let i=0; i<lines.length; i++) {
                        let hasError = false;
                        const origError = this.errorCallback;
                        this.errorCallback = (ln, type, reason) => { origError(ln, type, reason); hasError = true; };
                        await this.executeLine(lines[i], i+1);
                        this.errorCallback = origError;
                        if(hasError) break;
                    }
                }
            }
            
            async function runXCSL() {
                if(!isLoggedIn) { appendOutput('请先登录后再使用编辑器', true); return; }
                clearOutput();
                const code = codeEditor.value;
                if(!code.trim()) { appendOutput('[提示] 代码为空', false); return; }
                const interpreter = new XCSLInterpreter(
                    (text) => appendOutput(text, false),
                    async (prompt) => await requestInput(prompt),
                    (line, type, reason) => appendOutput(`error: ${type}: [第${line}行] ${reason}`, true)
                );
                try {
                    await interpreter.run(code);
                } catch(e) {
                    appendOutput(`error: RuntimeError: ${e.message}`, true);
                }
                if(outputConsole.children.length === 0) appendOutput('执行完成，无输出内容', false);
            }
            
            function openFile() {
                if(!isLoggedIn){ appendOutput('请登录后使用文件功能',true); return; }
                const inp=document.createElement('input'); inp.type='file'; inp.accept='.xcsl';
                inp.onchange=e=>{ const file=e.target.files[0]; if(!file)return;
                    const reader=new FileReader();
                    reader.onload=ev=>{ codeEditor.value=ev.target.result; updateLineNumbersAndHighlight(); appendOutput(`已加载: ${file.name}`,false); };
                    reader.readAsText(file);
                }; inp.click();
            }
            function saveFile() {
                if(!isLoggedIn){ appendOutput('请登录后使用保存功能',true); return; }
                const blob=new Blob([codeEditor.value],{type:'text/plain'});
                const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='script.xcsl'; link.click(); URL.revokeObjectURL(link.href);
                appendOutput('已保存 script.xcsl',false);
            }
            
            // 语法高亮：先转义HTML，再添加高亮标签
            function updateLineNumbersAndHighlight() {
                const code = codeEditor.value;
                const lines = code.split(/\r?\n/);
                let lineNumbersHtml = '';
                for(let i=1; i<=lines.length; i++) lineNumbersHtml += `<span>${i}</span>`;
                lineNumbersDiv.innerHTML = lineNumbersHtml;
                
                let highlightedLines = [];
                for(let line of lines) {
                    let escaped = escapeHtml(line);
                    // 注释
                    escaped = escaped.replace(/(\/\/.*)$/, '<span class="hl-comment">$1</span>');
                    // 关键词 set, out, in
                    escaped = escaped.replace(/\b(set|out|in)\b/gi, '<span class="hl-keyword">$1</span>');
                    // 类型 str, int
                    escaped = escaped.replace(/\b(str|int)\b/gi, '<span class="hl-type">$1</span>');
                    // 变量名（字母数字下划线，非关键字）
                    escaped = escaped.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\b/g, (match) => {
                        if(['set','out','in','str','int'].includes(match.toLowerCase())) return match;
                        return `<span class="hl-variable">${match}</span>`;
                    });
                    // 数字
                    escaped = escaped.replace(/\b(\d+)\b/g, '<span class="hl-number">$1</span>');
                    // 字符串
                    escaped = escaped.replace(/("[^"]*")/g, '<span class="hl-string">$1</span>');
                    // 运算符
                    escaped = escaped.replace(/([+\-*/=])/g, '<span class="hl-operator">$1</span>');
                    highlightedLines.push(`<div>${escaped}</div>`);
                }
                syntaxHighlight.innerHTML = `<code>${highlightedLines.join('')}</code>`;
                syntaxHighlight.scrollTop = codeEditor.scrollTop;
                syntaxHighlight.scrollLeft = codeEditor.scrollLeft;
            }
            
            codeEditor.addEventListener('input', updateLineNumbersAndHighlight);
            codeEditor.addEventListener('scroll', () => {
                syntaxHighlight.scrollTop = codeEditor.scrollTop;
                syntaxHighlight.scrollLeft = codeEditor.scrollLeft;
            });
            
            // 登录遮罩逻辑
            function createLoginOverlay() {
                if(overlayElement) overlayElement.remove();
                const ov=document.createElement('div'); ov.className='login-overlay';
                ov.innerHTML=`<div class="login-prompt-card"><h3>XCSL 编辑器</h3><p>请登录后使用 XCSL 语言环境</p><div class="prompt-buttons"><button class="prompt-btn prompt-btn-secondary" id="overlayBackHome">返回首页</button><button class="prompt-btn prompt-btn-primary" id="overlayGoLogin">前往登录</button></div></div>`;
                editorLayout.appendChild(ov); overlayElement=ov;
                document.getElementById('overlayBackHome')?.addEventListener('click',()=>window.location.href='index.html');
                document.getElementById('overlayGoLogin')?.addEventListener('click',()=>window.location.href='login.html');
            }
            function removeLoginOverlay(){ if(overlayElement){ overlayElement.remove(); overlayElement=null; } }
            
            async function updateAuthUI() {
                const valid = await window.xcsAuth.verifySession();
                if(valid){
                    const user=await window.xcsAuth.getCurrentUser();
                    if(user?.nickname){
                        isLoggedIn=true;
                        navLoginText.textContent=user.nickname;
                        accountBtn.onclick=()=>window.location.href='admin.html';
                        removeLoginOverlay(); editorLayout.classList.remove('blur-editor');
                        codeEditor.disabled=false; runBtn.disabled=false; openBtn.disabled=false; saveBtn.disabled=false;
                        clearOutput(); appendOutput(`欢迎回来，${user.nickname}！XCSL 编辑器已解锁。`,false);
                        return;
                    }
                }
                isLoggedIn=false;
                navLoginText.textContent='账户';
                accountBtn.onclick=()=>window.location.href='login.html';
                editorLayout.classList.add('blur-editor'); createLoginOverlay();
                codeEditor.disabled=true; runBtn.disabled=true; openBtn.disabled=true; saveBtn.disabled=true;
                clearOutput(); appendOutput('编辑器已锁定，请登录后使用。',false);
            }
            
            const defaultCode = `// XCSL 新语法演示
set str name = "XCSL"
out("Hello, ", name, end="\\n")
set int a = 10
set int b = 20
set int sum = a + b
out("sum = ", sum, end="\\n")
in(age, "请输入您的年龄: ")
out("您的年龄是: ", age, end="\\n")
out("计算 100 - 25 * 2 = ", 100 - 25 * 2, end="\\n")`;
            if(!codeEditor.value) codeEditor.value = defaultCode;
            updateLineNumbersAndHighlight();
            
            runBtn.addEventListener('click', runXCSL);
            clearBtn.addEventListener('click', clearOutput);
            openBtn.addEventListener('click', openFile);
            saveBtn.addEventListener('click', saveFile);
            logoHome.addEventListener('click', () => window.location.href='index.html');
            window.addEventListener('storage', (e) => { if(e.key==='xcs_session') updateAuthUI(); });
            updateAuthUI();
        })();
    </script>
</body>
</html>
